<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master BRC - Live Barista Recipe & Cost Viewer</title>
    <!-- Tailwind CSS for dashboard grid & controls -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        coffee: {
                            50: '#fdf8f6',
                            100: '#f2e8e5',
                            600: '#8c6239',
                            700: '#6f4e37',
                            800: '#5c4033',
                            900: '#3c2817',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-coffee-50 text-coffee-900 min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <header class="bg-coffee-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-coffee-700 p-2 rounded-lg text-xl">☕</div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">Master BRC</h1>
                    <p class="text-xs text-coffee-200">Live Barista Recipe & Cost Viewer</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 mt-2 sm:mt-0">
                <span id="syncStatus" class="text-xs bg-amber-500/20 text-amber-300 px-2.5 py-1 rounded-full font-medium flex items-center">
                    <span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-pulse"></span> Connecting...
                </span>
                <button onclick="syncData()" class="bg-coffee-700 hover:bg-coffee-600 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center">
                    🔄 Sync Sheet
                </button>
                <button onclick="openSettings()" class="bg-coffee-800 hover:bg-coffee-700 text-white text-xs px-3 py-2 rounded-lg font-medium transition flex items-center">
                    ⚙️ Settings
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Search & Filter Bar -->
        <div class="bg-white rounded-xl shadow-sm p-4 mb-6 border border-coffee-100 flex flex-col md:flex-row gap-4 justify-between items-center">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">🔍</span>
                <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="Search drinks or ingredients..." 
                    class="w-full pl-10 pr-4 py-2 bg-coffee-50 border border-coffee-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-coffee-600">
            </div>
            <div id="categoryFilters" class="flex flex-wrap gap-2 w-full md:w-auto justify-start md:justify-end">
                <button onclick="setCategory('ALL')" class="category-btn px-4 py-1.5 rounded-lg text-xs font-semibold bg-coffee-800 text-white transition">ALL</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="hidden text-center py-20">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-coffee-700 border-t-transparent"></div>
            <p class="mt-3 text-sm text-coffee-700 font-medium">Syncing live recipes from Google Sheet...</p>
        </div>

        <!-- Recipe Grid -->
        <div id="recipeGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- Recipe Detail Modal (Matches exact Google Sheet HTML Template Design) -->
    <div id="recipeModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-6 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 hover:bg-gray-200 text-gray-700 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm transition z-10">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 relative">
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 font-bold">✕</button>
            <h2 class="text-lg font-bold text-coffee-900 mb-2">Google Sheet API Settings</h2>
            <p class="text-xs text-gray-600 mb-4">You can change or update your automatic Web App URL here if needed.</p>
            <label class="block text-xs font-semibold text-coffee-800 mb-1">Web App URL:</label>
            <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec" 
                class="w-full p-2.5 bg-coffee-50 border border-coffee-200 rounded-lg text-xs mb-4 focus:ring-2 focus:ring-coffee-600 outline-none">
            <div class="flex justify-end space-x-2">
                <button onclick="closeSettings()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-xs font-semibold hover:bg-gray-200">Cancel</button>
                <button onclick="saveApiUrl()" class="px-4 py-2 bg-coffee-800 text-white rounded-lg text-xs font-semibold hover:bg-coffee-700">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-coffee-900 text-coffee-200 text-xs py-4 text-center mt-auto">
        Master BRC • Live Barista Recipe & Cost Viewer
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        let recipes = [];
        let activeCategory = 'ALL';
        // Automatically set your default URL if none saved in browser storage
        let apiUrl = localStorage.getItem('master_brc_api_url') || 'https://script.google.com/macros/s/AKfycbzxKdUrcc1Mdr-u6efKTJt54ireNA8Bm59AVyx1wazY1aMKUstnI2WZhcJ5ZfxSu8iS/exec';

        window.onload = function() {
            document.getElementById('apiUrlInput').value = apiUrl;
            fetchRecipes();
        };

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveApiUrl() {
            const val = document.getElementById('apiUrlInput').value.trim();
            if (val) {
                localStorage.setItem('master_brc_api_url', val);
                apiUrl = val;
                closeSettings();
                fetchRecipes();
            }
        }

        function syncData() {
            fetchRecipes();
        }

        async function fetchRecipes() {
            const statusEl = document.getElementById('syncStatus');
            const loadingEl = document.getElementById('loadingState');
            
            loadingEl.classList.remove('hidden');
            statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-ping"></span> Syncing...`;

            try {
                const response = await fetch(apiUrl);
                const result = await response.json();
                
                if (result.status === 'success' && Array.isArray(result.data)) {
                    recipes = result.data;
                    statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 mr-1.5"></span> Live Connected (${recipes.length} recipes)`;
                    buildCategories();
                    renderGrid(recipes);
                } else {
                    throw new Error(result.message || 'Invalid data format');
                }
            } catch (err) {
                console.error(err);
                statusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-red-500 mr-1.5"></span> Connection Error`;
                alert('Failed to sync recipes from Google Sheet. Please check your URL.');
            } finally {
                loadingEl.classList.add('hidden');
            }
        }

        function buildCategories() {
            const cats = ['ALL', ...new Set(recipes.map(r => r.category).filter(Boolean))];
            const container = document.getElementById('categoryFilters');
            container.innerHTML = cats.map(cat => `
                <button onclick="setCategory('${cat}')" class="category-btn px-4 py-1.5 rounded-lg text-xs font-semibold transition ${activeCategory === cat ? 'bg-coffee-800 text-white' : 'bg-coffee-100 text-coffee-800 hover:bg-coffee-200'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            activeCategory = cat;
            buildCategories();
            filterRecipes();
        }

        function filterRecipes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = recipes.filter(r => {
                const matchesCat = activeCategory === 'ALL' || r.category === activeCategory;
                const matchesSearch = (r.name && r.name.toLowerCase().includes(query)) ||
                                      (r.ingredients && r.ingredients.some(i => i.item.toLowerCase().includes(query)));
                return matchesCat && matchesSearch;
            });
            renderGrid(filtered);
        }

        function renderGrid(data) {
            const grid = document.getElementById('recipeGrid');
            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500 text-sm">No recipes found matching your search.</div>`;
                return;
            }

            grid.innerHTML = data.map((r, index) => `
                <div onclick="openRecipeModal(${recipes.indexOf(r)})" class="bg-white rounded-xl shadow-sm hover:shadow-md transition border border-coffee-100 overflow-hidden cursor-pointer flex flex-col">
                    <div class="h-48 bg-coffee-100 relative overflow-hidden">
                        ${r.image ? `<img src="${r.image}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-3xl">☕</div>`}
                        <span class="absolute top-2 left-2 bg-coffee-900/80 text-white text-[10px] px-2 py-0.5 rounded backdrop-blur-sm font-medium">${r.category || 'Recipe'}</span>
                    </div>
                    <div class="p-4 flex flex-col flex-grow">
                        <h3 class="font-bold text-coffee-900 text-sm mb-1">${r.name || 'Untitled Drink'}</h3>
                        <div class="flex items-center text-xs text-gray-500 space-x-3 mb-3">
                            <span>🥤 ${r.servingSize || 'Standard'}</span>
                            <span>⏱️ ${r.prepTime ? r.prepTime + ' mins' : '3 mins'}</span>
                        </div>
                        <div class="mt-auto pt-2 border-t border-coffee-50 flex justify-between items-center text-xs">
                            <span class="text-gray-500">Total Cost</span>
                            <span class="font-bold text-coffee-800 text-sm">${r.totalCost || 'P0.00'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function tidy(s) {
            s = String(s == null ? '' : s);
            if (s !== '' && s === s.toUpperCase()) {
                s = s.toLowerCase().replace(/(^|[\s(\/-])([a-z])/g, function (m, a, b) {
                    return a + b.toUpperCase();
                });
            }
            return s;
        }

        function money(s) { 
            return String(s == null ? '' : s).replace(/^P/, 'PHP '); 
        }

        function unit(s) { 
            return String(s == null ? '' : s).replace(/\s+[A-Za-z]+$/, function (u) { return u.toLowerCase(); }); 
        }

        function openRecipeModal(index) {
            const r = recipes[index];
            if (!r) return;

            const modal = document.getElementById('recipeModal');
            const content = document.getElementById('modalContent');

            const nameParts = String(r.name || '').split(/\s+-\s+/);
            const title = tidy(nameParts[0]);
            const subtitle = tidy(nameParts.slice(1).join(' - '));

            const steps = String(r.steps || '').split(/\r?\n/)
                .map(function (s) { return s.replace(/^\s*\d+[\.\)]\s*/, '').trim(); })
                .filter(function (s) { return s.length > 0; });

            content.innerHTML = `
                <style>
                    .modal-body { font-family: Arial, Helvetica, sans-serif; color: #241c17; font-size: 12px; }
                    .modal-body table { border-collapse: collapse; width: 100%; }
                    .modal-body .label { font-size: 10px; color: #7a6e65; }
                    .modal-body .value { font-size: 13px; font-weight: bold; }
                    .modal-body h2 { font-size: 16px; color: #2b1d16; margin: 20px 0 6px 0; }
                    .modal-body th { text-align: left; font-size: 10px; color: #7a6e65; font-weight: normal; padding: 5px 0; border-bottom: 1px solid #241c17; }
                </style>

                <div class="modal-body bg-white">
                    <table width="100%" cellpadding="0" cellspacing="0">
                        <tr>
                            <td bgcolor="#2b1d16" style="padding: 20px 24px; border-radius: 8px;">
                                <div style="font-size: 24px; font-weight: bold; color: #ffffff;">${title}</div>${subtitle ? `<div style="font-size: 14px; color: #d8c9bb; margin-top: 4px;">${subtitle}</div>` : ''}
                            </td>
                        </tr>
                    </table>

                    <table width="100%" cellpadding="0" cellspacing="0" style="margin-top: 16px;">
                        <tr>
                            <td width="240" valign="top">
                                ${r.image && r.image !== "" ? 
                                    `<img src="${r.image}" width="230" style="border-radius: 6px;">` : 
                                    `<table width="230" cellpadding="0" cellspacing="0"><tr><td bgcolor="#efece7" height="180" align="center" style="color: #7a6e65; border-radius: 6px;">No photo</td></tr></table>`
                                }
                            </td>
                            <td valign="top" style="padding-left: 18px;">
                                <table width="100%" cellpadding="0" cellspacing="0">
                                    <tr><td style="padding: 6px 0; border-bottom: 1px solid #e8e1d8;">
                                        <div class="label
